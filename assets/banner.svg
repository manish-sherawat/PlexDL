<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#00f2fe" fill-opacity="0.08" filter="url(#softGlow)" />
  <circle cx="1080" cy="190" r="180" fill="#7928ca" fill-opacity="0.1" filter="url(#softGlow)" />
  <circle cx="640" cy="190" r="220" fill="#0284c7" fill-opacity="0.06" filter="url(#softGlow)" />

  <!-- Modern Circuit Graphic Lines in background -->
  <g opacity="0.3" stroke="url(#cyanBlue)" stroke-width="1.5" fill="none">
    <path d="M 50 190 L 140 190 L 190 140 L 320 140" />
    <circle cx="320" cy="140" r="3" fill="#00f2fe" />
    <path d="M 120 280 L 220 280 L 260 240 L 360 240" />
    <circle cx="360" cy="240" r="3" fill="#38bdf8" />
    <path d="M 960 140 L 1060 140 L 1110 190 L 1230 190" />
    <circle cx="960" cy="140" r="3" fill="#7928ca" />
    <path d="M 920 240 L 1020 240 L 1060 280 L 1160 280" />
    <circle cx="920" cy="240" r="3" fill="#ff0080" />
  </g>

  <!-- Center Card / Glowing Container -->
  <g transform="translate(640, 190)">
    <!-- Central Emblem / Icon -->
    <g transform="translate(0, -95)">
      <!-- Outer Hexagon / Shield Ring -->
      <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="#0d1527" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#glow)" />
      
      <!-- Inner Lightning Bolt -->
      <path d="M 4 -28 L -16 2 L 2 2 L -4 28 L 18 -2 L 0 -2 Z" fill="url(#cyanBlue)" />
      
      <!-- Multi-NIC Wave Rings -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
      <circle cx="0" cy="0" r="70" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2 12" opacity="0.4" />
    </g>

    <!-- Main Title -->
    <text x="0" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="3" fill="url(#textGrad)" filter="url(#glow)">
      PLEXDL
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#94a3b8">
      MULTI-NETWORK BANDWIDTH AGGREGATION &bull; STREAM EXTRACTION &bull; PRIVACY-FIRST
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 80)">
      <!-- Pill 1: Multi-NIC Bonding -->
      <g transform="translate(-320, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <circle cx="-75" cy="0" r="4" fill="#00f2fe" />
        <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Multi-NIC Sockets</text>
      </g>

      <!-- Pill 2: Segmented Engine -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <circle cx="-75" cy="0" r="4" fill="#38bdf8" />
        <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Adaptive Ranges</text>
      </g>

      <!-- Pill 3: Media Extraction -->
      <g transform="translate(110, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <circle cx="-75" cy="0" r="4" fill="#818cf8" />
        <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">HLS / DASH Muxing</text>
      </g>

      <!-- Pill 4: Zero Telemetry -->
      <g transform="translate(325, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
        <circle cx="-75" cy="0" r="4" fill="#10b981" />
        <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Zero Telemetry</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border Line -->
  <line x1="0" y1="378" x2="1280" y2="378" stroke="url(#cyanBlue)" stroke-width="2" opacity="0.7" />
</svg>
